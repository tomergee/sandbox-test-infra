name: test-warmpool-only
namespace:
  number: 1
  prefix: agent-sandbox
tuningSets:
- name: BurstCreate
  qpsLoad:
    qps: 10
steps:
- name: Setup Sandbox Template
  phases:
  - namespaceRange: {min: 1, max: 1}
    replicasPerNamespace: 1
    tuningSet: BurstCreate
    objectBundle:
    - basename: template
      objectTemplatePath: "../../agent-sandbox/dev/load-test/cluster-loader-sandbox-template.yaml"

- name: Setup Sandbox Warm Pool
  phases:
  - namespaceRange: {min: 1, max: 1}
    replicasPerNamespace: 1
    tuningSet: BurstCreate
    objectBundle:
    - basename: warmpool
      objectTemplatePath: "../../agent-sandbox/dev/load-test/cluster-loader-sandbox-warmpool.yaml"

- name: Pause forever
  measurements:
  - Identifier: WaitAfterReady
    Method: Sleep
    Params:
      action: start
      duration: 300s
