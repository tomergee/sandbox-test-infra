apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler
  namespace: scraper
  labels:
    pprof-scraper: "true"
data:
  config: |
    - name: cpu
      url: https://localhost:10259/debug/pprof/profile?seconds=10
      interval: 1m
    - name: heap
      url: https://localhost:10259/debug/pprof/heap
      interval: 1m
    - name: goroutine
      url: https://localhost:10259/debug/pprof/goroutine
      interval: 1m
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kcm
  namespace: scraper
  labels:
    pprof-scraper: "true"
data:
  config: |
    - name: cpu
      url: https://localhost:10257/debug/pprof/profile?seconds=10
