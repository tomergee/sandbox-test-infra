apiVersion: v1
kind: ConfigMap
metadata:
  name: kspan-proxy
  namespace: scraper
  labels:
    pprof-scraper: "true"
data:
  config: |
    - name: cpu
      url: http://localhost:3381/debug/pprof/profile?seconds=10
      interval: 1m
    - name: heap
      url: http://localhost:3381/debug/pprof/heap
      interval: 1m
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apiserver
  namespace: scraper
  labels:
    pprof-scraper: "true"
data:
  config: |
    - name: cpu
      url: http://localhost/debug/pprof/profile?seconds=10
      interval: 1m
      socketpath: /etc/srv/kubernetes/kube-apiserver/debug.socket
    - name: heap
      url: http://localhost/debug/pprof/heap
      interval: 1m
      socketpath: /etc/srv/kubernetes/kube-apiserver/debug.socket
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: etcd-main
  namespace: scraper
  labels:
    pprof-scraper: "true"
data:
  config: |
    - name: cpu
      url: https://127.0.0.1:2379/debug/pprof/profile?seconds=10
      interval: 1m
      pki:
        cacert: /etc/srv/kubernetes/pki/etcd-apiserver-ca.crt
        cert: /etc/srv/kubernetes/pki/etcd-apiserver-client.crt
        key: /etc/srv/kubernetes/pki/etcd-apiserver-client.key
    - name: heap
      url: https://127.0.0.1:2379/debug/pprof/heap
      interval: 1m
      pki:
        cacert: /etc/srv/kubernetes/pki/etcd-apiserver-ca.crt
        cert: /etc/srv/kubernetes/pki/etcd-apiserver-client.crt
        key: /etc/srv/kubernetes/pki/etcd-apiserver-client.key
---
apiVersion: v1
