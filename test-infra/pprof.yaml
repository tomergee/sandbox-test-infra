apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-autoscaler
  namespace: scraper
  labels:
    pprof-scraper: "true"
data:
  config: |
    - name: cpu
      url: http://localhost:8085/debug/pprof/profile?seconds=30
      interval: 1m
    - name: heap
      url: http://localhost:8085/debug/pprof/heap
      interval: 1m
    - name: trace
      url: http://localhost:8085/debug/pprof/trace?seconds=30
      interval: 1m
