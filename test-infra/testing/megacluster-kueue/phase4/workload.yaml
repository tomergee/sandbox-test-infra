# ==============================================================================
# Kubernetes Job Configuration Template (with Topology Annotations)
#
# This template defines a Kubernetes Job resource suitable for batch tasks.
# It includes Kueue integration via labels for queue and priority, and specific
# annotations to express podSet topology preferences (required or preferred).
# ==============================================================================

# ------------------------------------------------------------------------------
# Template Variables Definition
# ------------------------------------------------------------------------------
{{$CpuRequest := DefaultParam .CpuRequest "5m"}} # Default CPU request per pod created by the Job.
{{$Size := DefaultParam .Size 10}}             # Number of parallel pods/completions for the Job.
{{$BIND_PORT := DefaultParam .CL2_BIND_PORT false}} # If true, bind a specific host port to the container port.
{{$PriorityClass := .PriorityClass}}           # The Kubernetes PriorityClass name for the Job's pods. Used by Kueue.
{{$QueueName := .QueueName}}                   # The target Kueue LocalQueue name for this Job.
{{$Group := .Group}}                           # Label value for grouping related resources.
{{$WorkloadType := .WorkloadType}}             # Label value indicating the type of workload.
{{$PreferredTopology := DefaultParam .PreferredTopology ""}} # Optional: Name of the preferred topology key (e.g., zone).
{{$RequiredTopology := DefaultParam .RequiredTopology ""}} # Optional: Name of the required topology key (e.g., node). Corrected from '.DefaultParam'.

# ==============================================================================
# Job Resource Definition
# ==============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: {{.Name}}
  labels:
    kueue.x-k8s.io/queue-name: {{$QueueName}}
    kueue.x-k8s.io/priority-class: {{$PriorityClass}}
    group: {{$Group}}
    type: {{$WorkloadType}}
spec:
  parallelism: {{$Size}}
  completions: {{$Size}}
  suspend: true
  completionMode: Indexed
  template:
    metadata:
      labels:
        type: {{$WorkloadType}}
        group: {{$Group}}
        # Optional: Expresses a preference for pods in this set to be scheduled
        # within the specified topology domain (e.g., "topology.kubernetes.io/zone").
        # Kueue will try to satisfy this but may schedule across domains if necessary.
{{if $PreferredTopology}}
      annotations:
        kueue.x-k8s.io/podset-preferred-topology: {{$PreferredTopology}}
{{end}}
        # Optional: Expresses a requirement for pods in this set to be scheduled
        # within the specified topology domain (e.g., "kubernetes.io/hostname").
        # Kueue will fail admission if this cannot be satisfied.
{{if $RequiredTopology}}
      annotations:
        kueue.x-k8s.io/podset-required-topology: {{$RequiredTopology}}
{{end}}
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        worker-node-pool: "true"
      containers:
      - name: "{{$WorkloadType}}-job"
        image: busybox
{{if $BIND_PORT}}
        ports:
        - containerPort: 1328
          hostPort: 1328
{{end}}
        command: ["sleep", "36000"]
        resources:
          requests:
            cpu: {{$CpuRequest}}