# ==============================================================================
# Kueue Topology Configuration Template (Customizable & GKE Default Levels)
#
# This template defines a Kueue Topology resource. Topology resources describe
# the hierarchical structure of nodes within the cluster, typically based on
# physical layout (e.g., rack, PDU, host) or other logical groupings.
# This information is used by Kueue in conjunction with ResourceFlavors to
# enable topology-aware scheduling for workloads that require co-located pods
# (e.g., for high-bandwidth communication or data locality).
#
# This template allows for:
# 1. Optional inclusion of standard GKE topology levels (enabled by default).
# 2. Dynamic definition of additional custom topology levels based on a common
#    prefix and a specified number of levels (CustomLevelCount), matching labels
#    that might be generated by node annotation scripts.
# ==============================================================================

# ------------------------------------------------------------------------------
# Template Variables Definition
# ------------------------------------------------------------------------------
# These variables are expected to be passed to the template during execution by Clusterloader2.
# DefaultParam is a Clusterloader2 templating function to provide default values
# if a parameter is not explicitly passed.

# {{.Name}}                 - (Required) The metadata.name for the Topology resource.
#                              Example: "cluster-default-topology"
#                              This variable is typically passed directly.

# {{$DefaultGkeTopology := DefaultParam .DefaultGkeTopology true}}
#                          - (Optional) Boolean flag to control the inclusion of standard GKE topology levels.
#                            Defaults to 'true' if not specified.
#                            If 'true', standard GKE topology labels are added to the levels list.
#                            If 'false', standard GKE topology labels are omitted.
#                            Example: true

# {{$CustomTopologyPrefix := DefaultParam .CustomTopologyPrefix ""}}
#                          - (Optional, but Required if CustomLevelCount > 0) The prefix string for the
#                            generated custom node labels. This string will be prepended to "/levelX"
#                            to form the actual nodeLabel for each custom topology level.
#                            Example: "my.corp.topology"

# {{$CustomLevelCount := DefaultParam .CustomLevelCount 0}}
#                          - (Optional) An integer specifying the number of custom topology levels to generate.
#                            Defaults to 0 if not specified (meaning no custom levels).
#                            The template will attempt to generate levels from 0 to (CustomLevelCount - 1).

# ------------------------------------------------------------------------------
# Example of providing parameters (e.g., in a JSON/YAML input to Clusterloader2):
#
# Example 1: Include GKE topology (default) and add 2 custom levels.
# providerConfig:
#   variables:
#   - name: Name
#     value: "gke-plus-custom-topology"
#   - name: CustomTopologyPrefix # For custom levels
#     value: "my.cluster.com/custom"
#   - name: CustomLevelCount # For 2 custom levels (0, 1)
#     value: 2
#   # DefaultGkeTopology is true by default, so not explicitly set here.
#
# This would generate a Topology with GKE levels followed by:
#   - "my.cluster.com/custom/level0"
#   - "my.cluster.com/custom/level1"
#
# Example 2: Only custom topology (3 levels), GKE topology disabled.
# providerConfig:
#   variables:
#   - name: Name
#     value: "only-custom-topology"
#   - name: DefaultGkeTopology
#     value: false
#   - name: CustomTopologyPrefix
#     value: "my.corp.zone"
#   - name: CustomLevelCount
#     value: 3 # For 3 custom levels (level0, level1, level2)
#
# This would generate a Topology with only the 3 custom levels.
#
# Example 3: Only GKE topology (default behavior if no custom params).
# providerConfig:
#   variables:
#   - name: Name
#     value: "gke-default-topology"
#   # No CustomTopologyPrefix or CustomLevelCount means no custom levels.
#   # DefaultGkeTopology is true by default.
# ==============================================================================
# Topology Resource Definition
# ==============================================================================
{{$DefaultGkeTopology := DefaultParam .DefaultGkeTopology true}}
{{$CustomLevelCount := DefaultParam .CustomLevelCount 0}}
{{$CustomTopologyPrefix := DefaultParam .CustomTopologyPrefix ""}}
{{$TOPOLOGY_API_VERSION := DefaultParam .CL2_TOPOLOGY_API_VERSION "v1beta2"}} # v1beta2 is supported only in 0.15+

apiVersion: kueue.x-k8s.io/{{$TOPOLOGY_API_VERSION}}
kind: Topology
metadata:
  # Sets the name of purposefullyTopology resource from the .Name template variable.
  # This name is used to identify the topology configuration within Kueue.
  name: {{.Name}}
spec:
  # The 'levels' field defines the ordered hierarchy of topology domains.
  # Each item in the list represents a level, starting from the broadest (e.g., region)
  # to the most granular (e.g., host or specific hardware block).
  # The order is significant for topology-aware scheduling.
  levels:
  {{- if $DefaultGkeTopology }}
  # Standard GKE topology levels. These are included if $DefaultGkeTopology is true.
  - nodeLabel: "topology.gke.io/zone"
  - nodeLabel: "cloud.google.com/gce-topology-block"
  - nodeLabel: "cloud.google.com/gce-topology-subblock"
  - nodeLabel: "cloud.google.com/gce-topology-host"
  - nodeLabel: "kubernetes.io/hostname"
  {{- else }}

  # Custom topology levels.
  # These are generated if CustomTopologyPrefix is provided.
  {{- if $CustomTopologyPrefix }}
    {{- range $levelIndex := Loop $CustomLevelCount }}
  - nodeLabel: "{{$CustomTopologyPrefix}}/level{{$levelIndex}}" # Example: my.corp.topology/level0
    {{- end }}
  - nodeLabel: "kubernetes.io/hostname" # always have hostname as the last level
  {{- end }}
  {{- end }}

