- name: "Phase 3 - Teardown 1: Delete Namespaces"
  phases:
  - replicasPerNamespace: 0
    tuningSet: Sequence
    objectBundle:
      - basename: {{$NamespaceTeamAlpha}}
        objectTemplatePath: common/namespace.yaml
  - replicasPerNamespace: 0
    tuningSet: Sequence
    objectBundle:
      - basename: {{$NamespaceTeamBeta}}
        objectTemplatePath: common/namespace.yaml

- name: "Phase 3 - Teardown 2: Delete ClusterQueues"
  phases:
  - namespaceList: [""] # Target cluster scope.
    replicasPerNamespace: 0 # Trigger deletion.
    tuningSet: default
    objectBundle:
    # Delete Alpha CQ
    - basename: fairsharing-alpha-cq
      objectTemplatePath: common/clusterqueue.yaml
      templateFillMap:
        Namespace: "{{$NamespaceTeamAlpha}}-0"
        FairSharingWeight: {{$WeightAlpha}}
        Preemption: true
        Cohort: research-cohort
    # Delete Beta CQ
    - basename: fairsharing-beta-cq
      objectTemplatePath: common/clusterqueue.yaml
      templateFillMap:
        Namespace: "{{$NamespaceTeamBeta}}-0"
        FairSharingWeight: {{$WeightBeta}}
        Preemption: true
        Cohort: research-cohort
    # Delete Buffer CQ
    - basename: fairsharing-buffer-cq
      objectTemplatePath: common/clusterqueue.yaml
      templateFillMap:
        Namespace: ""
        FairSharingWeight: 0
        Preemption: false
        Cohort: research-cohort