apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{.Name}}
  labels:
    group: statefulsets
spec:
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      group: statefulsets
      name: {{.Name}}
  serviceName: {{.Name}}
  replicas: {{.InstanceCount}}
  template:
    metadata:
      labels:
        group: statefulsets
        name: {{.Name}}
    spec:
      containers:
      - name: {{.Name}}
        image: k8s.gcr.io/pause:3.1
        ports:
          - containerPort: 80
            name: web
        resources:
          requests:
            cpu: 10m
            memory: "10M"
        volumeMounts:
          - name: pv
            mountPath: /var/pv
      terminationGracePeriodSeconds: 1
      # Add not-ready/unreachable tolerations for 15 minutes so that node
      # failure doesn't trigger pod deletion.
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 900
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 900
  # NOTE: PVs created this way should be cleaned-up manually, as deleting the StatefulSet doesn't automatically delete PVs.
  # To avoid deleting all the PVs at once during namespace deletion, they should be deleted explicitly via Phase.
  volumeClaimTemplates:
    - metadata:
        name: pv
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: dynamic-0
        resources:
          requests:
            storage: 1Gi
