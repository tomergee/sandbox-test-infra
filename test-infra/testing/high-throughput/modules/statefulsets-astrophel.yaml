{{$cpuRequest := DefaultParam .cpuRequest "5m"}}
{{$basename := DefaultParam .basename (printf "statefulset-%.0f" .size)}}
{{$threshold := DefaultParam .throughputThreshold 0}}

steps:
- name: Starting measurements for statefulsets
  measurements:
  - Identifier: WaitForRunningStatefulSets
    Method: WaitForControlledPodsRunning
    Params:
      apiVersion: apps/v1
      kind: StatefulSet
      action: start
      labelSelector: group = load
      operationTimeout: 1h

# CREATION
- module:
    path: modules/scheduling-throughput.yaml
    params:
      basename: {{$basename}}
      action: start
      threshold: {{$threshold}}
- name: Creating services/configmaps for size {{.size}}
  phases:
  - namespaceRange:
      min: {{.minNamespace}}
      max: {{.maxNamespace}}
    replicasPerNamespace: 1
    tuningSet: Sequence
    objectBundle:
    - basename: {{$basename}}-svc
      objectTemplatePath: service.yaml
    - basename: {{$basename}}-cfm
      objectTemplatePath: configmap.yaml
      templateFillMap:
        Length: 10240 # 10 KiB
- name: Creating statefulsets of size {{.size}}
  phases:
  - namespaceRange:
      min: {{.minNamespace}}
      max: {{.maxNamespace}}
    replicasPerNamespace: 1
    tuningSet: default
    objectBundle:
    - basename: {{$basename}}
      objectTemplatePath: statefulset-astrophel.yaml
      templateFillMap:
        Replicas: {{.size}}
        SvcName: {{$basename}}-svc
        ConfigMapName: {{$basename}}-cfm
        CpuRequest: {{$cpuRequest}}
        UsePVs: {{.usePVs}}
        UseGPUs: {{.useGPUs}}
- name: Waiting for 'create' to be completed
  measurements:
  - Method: WaitForControlledPodsRunning
    Identifier: WaitForRunningStatefulSets
    Params:
      action: gather
- module:
    path: modules/scheduling-throughput.yaml
    params:
      basename: {{$basename}}
      action: gather

# OPTIONAL DOWNSCALE AND UPSCALE
{{if .scaleDown}}
- name: Downscaling statefulsets of size {{.size}} to 0
  phases:
  - namespaceRange:
      min: {{.minNamespace}}
      max: {{.maxNamespace}}
    replicasPerNamespace: 1
    tuningSet: default
    objectBundle:
    - basename: {{$basename}}
      objectTemplatePath: statefulset-astrophel.yaml
      templateFillMap:
        Replicas: 0
        SvcName: {{$basename}}-svc
        ConfigMapName: {{$basename}}-cfm
        CpuRequest: {{$cpuRequest}}
        UsePVs: {{.usePVs}}
        UseGPUs: {{.useGPUs}}
- name: Waiting for downscaling to be completed
  measurements:
  - Method: WaitForControlledPodsRunning
    Identifier: WaitForRunningStatefulSets
    Params:
      action: gather

- name: Upscaling statefulsets of size 0 to {{.size}}
  phases:
  - namespaceRange:
      min: {{.minNamespace}}
      max: {{.maxNamespace}}
    replicasPerNamespace: 1
    tuningSet: default
    objectBundle:
    - basename: {{$basename}}
      objectTemplatePath: statefulset-astrophel.yaml
      templateFillMap:
        Replicas: {{.size}}
        SvcName: {{$basename}}-svc
        ConfigMapName: {{$basename}}-cfm
        CpuRequest: {{$cpuRequest}}
        UsePVs: {{.usePVs}}
        UseGPUs: {{.useGPUs}}
- name: Waiting for upscaling to be completed
  measurements:
  - Method: WaitForControlledPodsRunning
    Identifier: WaitForRunningStatefulSets
    Params:
      action: gather
{{end}}

# DELETION
# TODO(zawodny): add clean-up of residual PVC objects (enclosed in the "if .usePVs" condition).
- name: Deleting statefulsets of size {{.size}}
  phases:
  - namespaceRange:
      min: {{.minNamespace}}
      max: {{.maxNamespace}}
    replicasPerNamespace: 0
    tuningSet: default
    objectBundle:
    - basename: {{$basename}}
      objectTemplatePath: statefulset-astrophel.yaml
- name: Waiting for 'delete' to be completed
  measurements:
  - Method: WaitForControlledPodsRunning
    Instances:
    - Identifier: WaitForRunningStatefulSets
    Params:
      action: gather
- name: Deleting services/configmaps for size {{.size}}
  phases:
  - namespaceRange:
      min: {{.minNamespace}}
      max: {{.maxNamespace}}
    replicasPerNamespace: 0
    tuningSet: Sequence
    objectBundle:
    - basename: {{$basename}}-svc
      objectTemplatePath: service.yaml
    - basename: {{$basename}}-cfm
      objectTemplatePath: configmap.yaml