PVC_STORAGE_CLASS: "csi-lustre"
CAPACITY: "9000Gi"
PVC_ACCESS_MODE: "ReadWriteMany"
USE_DEPLOYMENT: true
USE_STATEFULSET: false

# Lustre instance provisioning needs VPC peering with servicenetworking.googleapis.com
NEEDS_VPC_PEERING: true
NEEDS_LUSTRE_CLEANUP: true
NETWORK_NAME: "perf-lustre-rapid-20k"
FIREWALL_RULE_NAME: "lustre-firewall-rule"
IP_RANGE_NAME: "lustre-ip-range"