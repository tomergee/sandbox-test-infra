apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: csi-parallelstore
provisioner: parallelstore.csi.storage.gke.io
parameters:
  network: perf-rapid-100
volumeBindingMode: Immediate
reclaimPolicy: Delete
allowedTopologies:
- matchLabelExpressions:
  - key: topology.gke.io/zone
    values:
    - asia-southeast1-a
    - asia-southeast1-b
    - asia-southeast1-c
    - europe-west4-a
    - europe-west4-b
    - europe-west4-c
    - us-central1-a
    - us-east4-a
    - us-east4-b
    - us-east4-c
