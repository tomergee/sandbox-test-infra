apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{.Name}}
spec:
  selector:
    matchLabels:
      name: {{.Name}}
  template:
    metadata:
      labels:
        name: {{.Name}}
    spec:
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10
        resources:
          requests:
            cpu: "{{.DaemonSetCpuRequest}}m"
            memory: "{{.DaemonSetMemoryRequest}}Mi"
      terminationGracePeriodSeconds: 1