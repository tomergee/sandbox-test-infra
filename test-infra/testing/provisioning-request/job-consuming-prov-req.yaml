apiVersion: batch/v1
kind: Job
metadata:
  name: {{.Name}}
  labels:
    group: ca
spec:
  backoffLimit: {{.BackoffLimit}}
  completions: {{.Completions}}
  parallelism: {{.Parallelism}}
  template:
    metadata:
      annotations:
        "cluster-autoscaler.kubernetes.io/consume-provisioning-request": "{{.Name}}"
      labels:
        group: ca
        name: {{.Name}}
    spec:
      nodeSelector:
{{ if .WorkloadSeparation }}
        group: group-{{.Index}}
{{end}}
{{ if .PodMachineFamily }}
        cloud.google.com/machine-family: {{.PodMachineFamily}}
{{end}}
      restartPolicy: Never
      containers:
      - image: k8s.gcr.io/pause:3.1
        name: {{.Name}}
{{if .EnforceOnePerNode}}
        ports:
        - name: http
          containerPort: 80
          hostPort: 80
{{end}}
        resources:
          requests:
            cpu: "{{.CpuRequest}}m"
            memory: "{{.MemoryRequest}}Mi"
{{ if ne .GpuRequest 0.0}}
            nvidia.com/gpu: "{{.GpuRequest}}"
{{end}}
          limits:
            cpu: "{{.CpuRequest}}m"
            memory: "{{.MemoryRequest}}Mi"
{{ if ne .GpuRequest 0.0}}
            nvidia.com/gpu: "{{.GpuRequest}}"
{{end}}
      dnsPolicy: Default
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
{{ if .WorkloadSeparation }}
      - key: group
        operator: "Equal"
        value: "group-{{.Index}}"
        effect: "NoSchedule"
{{end}}
