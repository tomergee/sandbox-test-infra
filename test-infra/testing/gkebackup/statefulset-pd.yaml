apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{.Name}}
  labels:
    gkebackup: volume
spec:
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      gkebackup: volume
      name: {{.Name}}
  serviceName: {{.Name}}
  replicas: {{.Replicas}}
  template:
    metadata:
      labels:
        gkebackup: volume
        name: {{.Name}}
    spec:
      containers:
      - name: {{.Name}}
        image: k8s.gcr.io/pause:3.1
        ports:
        - containerPort: 80
          name: web
        resources:
          # Keep the CpuRequest/MemoryRequest request equal percentage of 1-core, 4GB node.
          # For now, we're setting it to 0.5%.
          requests:
            cpu: 5m
            memory: "20M"
        volumeMounts:
        - name: storage-pv
          mountPath: /var/pv
      terminationGracePeriodSeconds: 1
      # Add not-ready/unreachable toleration for 15 minutes so that node
      # failure doesn't trigger pod deletion.
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 900
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 900
  # NOTE: PVs created this way should be cleaned-up manually, as deleting the StatefulSet doesn't automatically delete PVs.
  # To avoid deleting all the PVs at once during namespace deletion, they should be deleted explicitly via Phase.
  volumeClaimTemplates:
  - metadata:
      name: storage-pv
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: pd-standard-sc-0 # Name is autogenerated, hence the -0 prefix.
      resources:
        requests:
          storage: 10Gi
