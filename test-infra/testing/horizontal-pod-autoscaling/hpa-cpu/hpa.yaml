{{$deploymentName := (print .DeploymentBaseName "-" .Index)}}


apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{.Name}}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{$deploymentName}}
  minReplicas: {{.Replicas}}
  maxReplicas: {{.Replicas}}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
